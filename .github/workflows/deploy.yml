name: Deploy Vault to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "packages/site/**"
      - "schemas/**"
      - ".github/workflows/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install CLI deps
        run: cd packages/cli && npm ci

      - name: Build CLI
        run: cd packages/cli && npm run build

      - name: Validate vault
        run: node packages/cli/dist/index.js validate --strict

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clone Quartz v5
        run: git clone https://github.com/jackyzha0/quartz.git packages/site-build

      - name: Install Quartz deps
        run: cd packages/site-build && npm install

      - name: Initialize Quartz (sets up .quartz/plugins)
        run: |
          cd packages/site-build
          npx quartz create \
            --template obsidian \
            --source ${{ github.workspace }}/content \
            --strategy copy \
            --links shortest \
            --baseUrl ddank0.github.io/brain

      - name: Apply custom config and styles
        run: |
          cp packages/site/quartz.config.yaml packages/site-build/quartz.config.yaml
          cp packages/site/quartz/styles/custom.scss packages/site-build/quartz/styles/custom.scss

      - name: Build Quartz site
        run: cd packages/site-build && npx quartz build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site-build/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

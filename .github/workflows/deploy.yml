name: Deploy Vault to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "packages/site/**"
      - "schemas/**"
      - ".github/workflows/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install CLI deps
        run: cd packages/cli && npm ci

      - name: Build CLI
        run: cd packages/cli && npm run build

      - name: Validate vault
        run: node packages/cli/dist/index.js validate --strict

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"

      - name: Install site deps
        run: cd packages/site && npm ci

      - name: Build site + Pagefind index
        run: cd packages/site && npm run build
        env:
          VAULT_PATH: ${{ github.workspace }}/content

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
